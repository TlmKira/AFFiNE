name: Build self-host images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish. Leave empty to use the short Git SHA.
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Build native Node addons on Ubuntu 22.04 so the resulting glibc
    # requirement stays compatible with the Debian 12 runtime image.
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Prepare image names
        id: image
        shell: bash
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          SHORT_SHA="${GITHUB_SHA::9}"
          IMAGE_TAG="${{ inputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="$SHORT_SHA"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "affine_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kite-affine:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "notebook_image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kite-affine-notebook:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build frontend assets
        run: |
          corepack yarn affine web build
          corepack yarn affine mobile build
          corepack yarn affine admin build

      - name: Build server native package
        run: |
          corepack yarn workspace @affine/server-native build
          cd packages/backend/native
          ln -sf server-native.node server-native.x64.node
          ln -sf server-native.node server-native.arm64.node
          ln -sf server-native.node server-native.armv7.node

      - name: Build server bundle and production dependencies
        run: |
          corepack yarn affine server build
          corepack yarn config set --json supportedArchitectures.cpu '["x64", "arm64", "arm"]'
          corepack yarn config set --json supportedArchitectures.libc '["glibc"]'
          corepack yarn workspaces focus @affine/server --production
          corepack yarn workspace @affine/server prisma generate
          rm -rf packages/backend/server/node_modules
          mv ./node_modules ./packages/backend/server/node_modules
          rm -rf packages/backend/server/node_modules/@affine/server-native
          mkdir -p packages/backend/server/node_modules/@affine
          cp -a packages/backend/native packages/backend/server/node_modules/@affine/server-native

      - name: Build and push AFFiNE image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/deployment/node/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/kite-affine:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/kite-affine:${{ github.sha }}

      - name: Build and push Notebook image
        uses: docker/build-push-action@v6
        with:
          context: .docker/selfhost/notebook
          file: .docker/selfhost/notebook/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/kite-affine-notebook:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/kite-affine-notebook:${{ github.sha }}

      - name: Write deploy environment
        shell: bash
        run: |
          mkdir -p deploy-env
          cat > deploy-env/selfhost-images.env <<EOF
          IMAGE_OWNER=${IMAGE_OWNER}
          IMAGE_TAG=${IMAGE_TAG}
          AFFINE_IMAGE=ghcr.io/${IMAGE_OWNER}/kite-affine:${IMAGE_TAG}
          NOTEBOOK_IMAGE=ghcr.io/${IMAGE_OWNER}/kite-affine-notebook:${IMAGE_TAG}
          GIT_SHA=${GITHUB_SHA}
          EOF

      - name: Upload deploy environment
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-images-${{ env.IMAGE_TAG }}
          path: deploy-env/selfhost-images.env
          if-no-files-found: error

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## Self-host images published"
            echo
            echo "| Image | Tag |"
            echo "| --- | --- |"
            echo "| \`ghcr.io/${IMAGE_OWNER}/kite-affine\` | \`${IMAGE_TAG}\` |"
            echo "| \`ghcr.io/${IMAGE_OWNER}/kite-affine-notebook\` | \`${IMAGE_TAG}\` |"
            echo
            echo "Run this on the test server after pulling the latest repository code:"
            echo
            echo '```bash'
            echo "cd /opt/affine-fork"
            echo "git fetch origin feature/graduate-toolkit"
            echo "git checkout feature/graduate-toolkit"
            echo "git pull --ff-only origin feature/graduate-toolkit"
            echo "bash .docker/selfhost/deploy-ghcr.sh --owner ${IMAGE_OWNER} --tag ${IMAGE_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
